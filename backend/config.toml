[server]
host = "127.0.0.1"
port = 8000

[library]
# Relative to backend/
video_dir = "data/video"
# Creator photos named "<Creator tag>.jpg|.jpeg|.png|.webp"; missing ones are fetched from YouTube on download
creator_photo_dir = "data/creator"

[web]
# Built frontend (relative to backend/); served only when the directory exists
dist_dir = "../dist"

[submission]
# MeTube video quality (max height); options: best, 2160, 1440, 1080, 720, 480, 360, 240, worst
quality = "1080"
# How long to wait for MeTube to finish one download before giving up
download_timeout_seconds = 300
poll_interval_seconds = 2

[auth]
# How long a login stays valid; the password itself lives in .env
session_days = 30

[tool]
# ffmpeg executable used to write title/creator/album and the cover; a bare name is looked up on PATH
ffmpeg_path = "ffmpeg"
# ffprobe executable used to read codec/resolution/bitrate for the settings video list; ships with ffmpeg
ffprobe_path = "ffprobe"

[log]
# Options: DEBUG, INFO, WARN, ERROR
level = "INFO"
